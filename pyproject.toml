[project]
name = "going-ai-native"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "pytest>=8", "hypothesis>=6"]

[project.optional-dependencies]
frameworks = ["langgraph", "langchain-anthropic", "langsmith"]

[tool.setuptools.packages.find]
where = ["shared"]
include = ["ainative_kit*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
